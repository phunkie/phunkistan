name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: PHP ${{ matrix.php-version }} Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, tokenizer
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      # install, not update, because the lock is committed: a green build here
      # has to mean the same thing tomorrow as it does today.
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # Runs the story features and the describe specs together.
      - name: Run phpspec
        run: vendor/bin/phpspec run --all --no-interaction

  # Static analysis joins this job with the first file under src/. phpstan.neon
  # is already written and points there; it has nothing to read until then.
  lint:
    name: PHP ${{ matrix.php-version }} Code Style
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, tokenizer
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.php --dry-run --diff --allow-risky=yes
